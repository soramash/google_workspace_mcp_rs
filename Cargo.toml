[package]
name = "workspace-mcp-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Native Rust Google Workspace MCP server with 121 tools"
license = "MIT"

[[bin]]
name = "workspace-mcp-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", features = ["form", "http1", "json", "query", "tokio"] }
base64 = "=0.23.1"
futures-util = "=0.3.34"
fs2 = "=0.4.3"
getrandom = "=0.4.3"
jsonschema = { version = "=0.50.0", default-features = false }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto", "use_pem"] }
libc = "=0.2.189"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
time = { version = "=0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "=1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["cors", "limit", "set-header"] }
url = "=2.5.8"
uuid = { version = "=1.25.0", features = ["serde", "v4"] }
